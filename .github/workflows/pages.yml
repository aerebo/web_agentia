# Publica el sitio en GitHub Pages en cada push a main.
# Sube solo lo publico: index.html y assets/. docs/ y servidor-local.py se quedan fuera.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Armar el sitio
        run: |
          python3 armar.py

          # Enlaces, anclas y encabezados. Un enlace roto no rompe el
          # armado: la pagina se publica y el boton simplemente no hace
          # nada. Aqui si para la publicacion.
          python3 comprobar.py

          # Sello de version en el pie de cada pagina. Sin esto no hay forma
          # de saber si lo que ves es lo ultimo o lo que guardo tu navegador:
          # Pages manda las paginas con cache de 10 minutos y no deja tocar
          # sus cabeceras. Con la fecha a la vista, cualquiera del equipo
          # compara y sale de dudas sin recargar a ciegas.
          SELLO="$(TZ=America/Lima date '+%d/%m/%Y %H:%M') · ${GITHUB_SHA:0:7}"
          find _sitio -name 'index.html' -exec \
            sed -i "s|<span data-version>en desarrollo</span>|<span data-version>$SELLO</span>|" {} +
          echo "publicando version $SELLO"
          echo "paginas:" && find _sitio -name 'index.html' | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

      - id: despliegue
        uses: actions/deploy-pages@v4
